<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Traffic Racer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { 
    overflow: hidden; background: #000; 
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; 
    color: white;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    width: 100%;
    height: 100%;
    position: fixed;
    top: 0; left: 0;
  }
  canvas { display: block; width: 100%; height: 100%; }
  #homeScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; padding: 20px; }
  #homeScreen h1 { font-size: 38px; margin-bottom: 10px; background: linear-gradient(90deg, #ff6b6b, #ffd93d, #6bcb77); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; text-align: center; }
  #homeScreen .subtitle { font-size: 14px; color: #aaa; margin-bottom: 40px; text-align: center; }
  .home-btn { padding: 18px 40px; margin: 8px; font-size: 19px; border: none; border-radius: 14px; cursor: pointer; font-weight: bold; transition: all 0.2s; width: 280px; max-width: 85vw; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
  .home-btn:active { transform: scale(0.96); }
  #playBtn { background: linear-gradient(135deg, #4CAF50, #2e7d32); color: white; }
  #walletBtn { background: linear-gradient(135deg, #FF9800, #e65100); color: white; }
  #walletScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); display: none; flex-direction: column; z-index: 100; padding: 20px; overflow-y: auto; }
  #walletScreen h2 { font-size: 26px; margin: 20px 0; text-align: center; color: #ffd93d; }
  .wallet-card { background: linear-gradient(135deg, #2d3561, #1e2749); border-radius: 18px; padding: 22px; margin: 10px auto; max-width: 500px; width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,0.5); border: 1px solid rgba(255,217,61,0.2); }
  .wallet-card .label { color: #aaa; font-size: 12px; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
  .wallet-card .amount { font-size: 38px; font-weight: bold; color: #4CAF50; }
  .wallet-card .amount.pending { color: #FF9800; font-size: 26px; }
  .wallet-card .currency { font-size: 20px; color: #aaa; margin-left: 5px; }
  .withdraw-section { background: rgba(0,0,0,0.3); border-radius: 14px; padding: 18px; margin: 16px auto; max-width: 500px; width: 100%; }
  .withdraw-section h3 { color: #fff; margin-bottom: 12px; font-size: 16px; }
  .withdraw-section input, .withdraw-section select { width: 100%; padding: 13px; margin: 6px 0; background: #1a1a2e; border: 1px solid #444; color: white; border-radius: 8px; font-size: 15px; }
  .withdraw-section button { width: 100%; padding: 15px; margin-top: 8px; background: linear-gradient(135deg, #4CAF50, #2e7d32); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }
  .back-btn { padding: 13px 30px; background: #444; color: white; border: none; border-radius: 10px; font-size: 15px; cursor: pointer; margin: 20px auto; display: block; }
  #hud { position: absolute; top: 12px; left: 12px; color: #fff; font-size: 13px; text-shadow: 2px 2px 6px #000; pointer-events: none; z-index: 10; background: rgba(0,0,0,0.35); padding: 8px 12px; border-radius: 10px; line-height: 1.5; }
  #speed { color: #ffdd00; font-weight: bold; }
  #moneyHud { color: #4CAF50; font-weight: bold; }
  #gameOver { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); display: none; flex-direction: column; justify-content: center; align-items: center; color: white; z-index: 20; text-align: center; padding: 20px; }
  #gameOver h1 { color: #ff4444; font-size: 40px; margin: 10px; }
  #gameOver p { font-size: 17px; margin: 6px; }
  button.game-btn { padding: 14px 28px; margin: 8px; font-size: 16px; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; width: 280px; max-width: 85vw; }
  .btn-ad { background: linear-gradient(135deg, #FF9800, #e65100); color: white; }
  .btn-restart { background: linear-gradient(135deg, #4CAF50, #2e7d32); color: white; }
  .btn-menu { background: #444; color: white; }
  @media (max-width: 600px) {
    #homeScreen h1 { font-size: 30px; }
    .home-btn { font-size: 17px; padding: 15px 30px; }
    #hud { font-size: 12px; }
    .wallet-card .amount { font-size: 32px; }
    #gameOver h1 { font-size: 34px; }
  }
</style>
</head>
<body>

<div id="homeScreen">
  <h1>🏎️ TRAFFIC RACER</h1>
  <p class="subtitle">Kaza yapmadan ilerle, para kazan!</p>
  <button class="home-btn" id="playBtn" onclick="startGame()">🎮 OYNAMAYA BAŞLA</button>
  <button class="home-btn" id="walletBtn" onclick="showWallet()">💰 KASAM</button>
</div>

<div id="walletScreen">
  <h2>💰 KASAM</h2>
  <div class="wallet-card">
    <div class="label">Toplam Bakiye</div>
    <div class="amount"><span id="walletBalance">0.00</span><span class="currency">₺</span></div>
  </div>
  <div class="wallet-card">
    <div class="label">Çekim Bekleyen</div>
    <div class="amount pending"><span id="walletPending">0.00</span><span class="currency">₺</span></div>
  </div>
  <div class="withdraw-section">
    <h3>💸 Para Çek</h3>
    <select id="withdrawMethod">
      <option value="iban">🏦 IBAN</option>
      <option value="payeer">💳 Payeer</option>
    </select>
    <input type="text" id="withdrawAccount" placeholder="IBAN veya Payeer hesabı">
    <input type="number" id="withdrawAmount" placeholder="Çekilecek tutar (min 10₺)" min="10" step="0.01">
    <button id="withdrawBtn" onclick="requestWithdraw()">ÇEKİM TALEBİ OLUŞTUR</button>
  </div>
  <button class="back-btn" onclick="goHome()">← Ana Sayfa</button>
</div>

<div id="hud" style="display:none;">
  <div>💰 Para: <span id="moneyHud">0.00</span> ₺</div>
  <div>📏 Mesafe: <span id="distance">0</span> m</div>
  <div>⚡ Hız: <span id="speed">0</span> km/s</div>
</div>

<div id="gameOver">
  <h1>💥 KAZA!</h1>
  <p>Kazanılan: <span id="earned">0</span> ₺</p>
  <p>Kesilecek: <span id="penalty">0</span> ₺</p>
  <button class="game-btn btn-ad" onclick="watchAd()">📺 Reklam İzle (Kesinti Yok)</button>
  <button class="game-btn btn-restart" onclick="restart()">🔄 Yeniden Başla</button>
  <button class="game-btn btn-menu" onclick="goHome()">🏠 Ana Menü</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// Debug mesajları KAPALI
function debugLog() { /* sessiz */ }

// ==================== KASA ====================
function getWallet() {
  const data = localStorage.getItem('trafficRacerWallet');
  if (data) return JSON.parse(data);
  return { balance: 0, pending: 0, history: [] };
}
function saveWallet(w) { localStorage.setItem('trafficRacerWallet', JSON.stringify(w)); }
function addToWallet(amount) {
  const w = getWallet();
  w.balance += amount;
  saveWallet(w);
}

// ==================== SAHNE ====================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.Fog(0x87CEEB, 60, 220);

// Kamera — mobil dikey ekran için optimize
const camera = new THREE.PerspectiveCamera(65, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0, 4.5, 9);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);
renderer.domElement.style.display = 'none';

// ==================== IŞIKLAR ====================
scene.add(new THREE.AmbientLight(0xffffff, 1.4));
const hemiLight = new THREE.HemisphereLight(0x87CEEB, 0x2d5016, 0.9);
scene.add(hemiLight);

const sunLight = new THREE.DirectionalLight(0xffffff, 1.6);
sunLight.position.set(15, 30, 15);
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 1024;
sunLight.shadow.mapSize.height = 1024;
sunLight.shadow.camera.left = -30;
sunLight.shadow.camera.right = 30;
sunLight.shadow.camera.top = 30;
sunLight.shadow.camera.bottom = -30;
sunLight.shadow.bias = -0.0005;
scene.add(sunLight);

// ==================== YOL ====================
const ROAD_WIDTH = 11;
const ROAD_LENGTH = 300;

const road = new THREE.Mesh(
  new THREE.PlaneGeometry(ROAD_WIDTH, ROAD_LENGTH),
  new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.9, metalness: 0.1 })
);
road.rotation.x = -Math.PI/2;
road.position.z = -ROAD_LENGTH/2 + 20;
road.receiveShadow = true;
scene.add(road);

const laneMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.4 });
const laneDashes = [];
for (let i = 0; i < 50; i++) {
  const dash = new THREE.Mesh(new THREE.PlaneGeometry(0.22, 2.2), laneMat);
  dash.rotation.x = -Math.PI/2;
  dash.position.set(-ROAD_WIDTH/6, 0.01, -i * 6 + 20);
  scene.add(dash); laneDashes.push(dash);
  const dash2 = dash.clone();
  dash2.position.x = ROAD_WIDTH/6;
  scene.add(dash2); laneDashes.push(dash2);
}

const edgeMat = new THREE.MeshStandardMaterial({ color: 0xffdd00, emissive: 0xffdd00, emissiveIntensity: 0.3 });
const edge1 = new THREE.Mesh(new THREE.PlaneGeometry(0.35, ROAD_LENGTH), edgeMat);
edge1.rotation.x = -Math.PI/2;
edge1.position.set(-ROAD_WIDTH/2 + 0.4, 0.01, -ROAD_LENGTH/2 + 20);
scene.add(edge1);
const edge2 = edge1.clone();
edge2.position.x = ROAD_WIDTH/2 - 0.4;
scene.add(edge2);

const grassMat = new THREE.MeshStandardMaterial({ color: 0x2d5016, roughness: 1 });
const grass1 = new THREE.Mesh(new THREE.PlaneGeometry(80, ROAD_LENGTH), grassMat);
grass1.rotation.x = -Math.PI/2;
grass1.position.set(-ROAD_WIDTH/2 - 40, -0.1, -ROAD_LENGTH/2 + 20);
grass1.receiveShadow = true;
scene.add(grass1);
const grass2 = grass1.clone();
grass2.position.x = ROAD_WIDTH/2 + 40;
scene.add(grass2);

// ==================== MODEL YÜKLEME ====================
const gltfLoader = new GLTFLoader();

let kenneyColormap = null;

function getKenneyColormap() {
  if (kenneyColormap) return kenneyColormap;
  kenneyColormap = new THREE.TextureLoader().load('models/colormap.png');
  kenneyColormap.magFilter = THREE.NearestFilter;
  kenneyColormap.minFilter = THREE.NearestFilter;
  kenneyColormap.colorSpace = THREE.SRGBColorSpace;
  return kenneyColormap;
}

function prepareModel(model) {
  const colormap = getKenneyColormap();
  model.traverse((child) => {
    if (child.isMesh) {
      child.castShadow = true;
      child.receiveShadow = true;
      if (child.material) {
        child.material.map = colormap;
        child.material.needsUpdate = true;
      }
    }
  });
  return model;
}

function loadCarModel(path, fallbackColor = 0x00cc44) {
  return new Promise((resolve) => {
    gltfLoader.load(
      path,
      (gltf) => {
        const model = prepareModel(gltf.scene);
        resolve(model);
      },
      undefined,
      (error) => {
        resolve(createFallbackCar(fallbackColor));
      }
    );
  });
}

function createFallbackCar(color) {
  const car = new THREE.Group();
  car.userData.isFallback = true;
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(1.6, 0.6, 3.2),
    new THREE.MeshStandardMaterial({ color, metalness: 0.7, roughness: 0.3 })
  );
  body.position.y = 0.5;
  body.castShadow = true;
  car.add(body);
  const cabin = new THREE.Mesh(
    new THREE.BoxGeometry(1.3, 0.5, 1.4),
    new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9, roughness: 0.1, transparent: true, opacity: 0.85 })
  );
  cabin.position.set(0, 1.0, -0.1);
  cabin.castShadow = true;
  car.add(cabin);
  const wheelGeo = new THREE.CylinderGeometry(0.32, 0.32, 0.25, 16);
  const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
  [[-0.8, 0.32, 1.0], [0.8, 0.32, 1.0], [-0.8, 0.32, -1.0], [0.8, 0.32, -1.0]].forEach(pos => {
    const wheel = new THREE.Mesh(wheelGeo, wheelMat);
    wheel.rotation.z = Math.PI/2;
    wheel.position.set(...pos);
    wheel.castShadow = true;
    car.add(wheel);
  });
  return car;
}

// ==================== DURUM ====================
const state = {
  running: false,
  money: 0,
  distance: 0,
  speed: 0.4,
  maxSpeed: 2.8,
  cars: [],
  lastSpawn: 0,
  playerLane: 0,
  targetLane: 0,
  shake: 0,
  modelLoaded: false
};

// Kenney model ölçeği ve lane pozisyonları
const CAR_SCALE = 1.4;
const LANES = [-ROAD_WIDTH/3, 0, ROAD_WIDTH/3];

// ==================== OYUNCU ====================
let player = createFallbackCar(0x00cc44);
player.position.set(0, 0, 4);
scene.add(player);

loadCarModel('models/race-future.glb', 0x00cc44).then((model) => {
  scene.remove(player);
  model.scale.set(CAR_SCALE, CAR_SCALE, CAR_SCALE);
  model.rotation.y = Math.PI;
  model.position.set(0, 0, 4);
  scene.add(model);
  player = model;
  state.modelLoaded = true;
});

// ==================== KONTROL ====================
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
    state.targetLane = Math.max(-1, state.targetLane - 1);
  }
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
    state.targetLane = Math.min(1, state.targetLane + 1);
  }
});

// Dokunmatik — sol/sağ yarı
let touchLocked = false;
function handleTouch(clientX) {
  if (touchLocked) return;
  if (!state.running) return;
  touchLocked = true;
  setTimeout(() => { touchLocked = false; }, 150);
  const half = window.innerWidth / 2;
  if (clientX < half) {
    state.targetLane = Math.max(-1, state.targetLane - 1);
  } else {
    state.targetLane = Math.min(1, state.targetLane + 1);
  }
}

document.addEventListener('touchstart', e => {
  handleTouch(e.touches[0].clientX);
  e.preventDefault();
}, { passive: false });

document.addEventListener('click', e => {
  if (state.running) handleTouch(e.clientX);
});

// ==================== DÜŞMAN ====================
const carColors = [0xe74c3c, 0x3498db, 0x9b59b6, 0xe67e22, 0x1abc9c, 0xf39c12, 0x34495e];
const enemyModels = ['models/sedan.glb', 'models/suv.glb', 'models/taxi.glb', 'models/van.glb'];

async function spawnEnemyCar() {
  const lane = Math.floor(Math.random() * 3) - 1;
  const randomModel = enemyModels[Math.floor(Math.random() * enemyModels.length)];
  const fallbackColor = carColors[Math.floor(Math.random() * carColors.length)];
  
  const car = await loadCarModel(randomModel, fallbackColor);
  
  car.scale.set(CAR_SCALE, CAR_SCALE, CAR_SCALE);
  car.rotation.y = Math.PI;
  car.position.set(LANES[lane + 1], 0, -150);
  scene.add(car);
  state.cars.push(car);
}

// ==================== PARA ====================
function moneyPerMeter() {
  if (state.distance < 500) return 0.005;
  if (state.distance < 1500) return 0.01;
  if (state.distance < 3000) return 0.02;
  if (state.distance < 5000) return 0.035;
  return 0.05;
}

function checkCollision(a, b) {
  return Math.abs(a.position.x - b.position.x) < 1.2 &&
         Math.abs(a.position.z - b.position.z) < 2.8;
}

// ==================== DÖNGÜ ====================
let lastTime = performance.now();
let animationRunning = false;

function animate() {
  if (!animationRunning) return;
  requestAnimationFrame(animate);
  
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 16.67, 2);
  lastTime = now;
  
  if (!state.running) {
    renderer.render(scene, camera);
    return;
  }
  
  state.speed = Math.min(state.maxSpeed, state.speed + 0.0004 * dt);
  state.playerLane += (state.targetLane - state.playerLane) * 0.15 * dt;
  player.position.x = state.playerLane * (ROAD_WIDTH/3);
  player.rotation.z = -(state.targetLane - state.playerLane) * 0.25;
  
  state.shake = Math.max(0, state.shake - 0.05 * dt);
  const shakeX = (Math.random() - 0.5) * state.shake * 0.08;
  const shakeY = (Math.random() - 0.5) * state.shake * 0.08;
  
  // KAMERA — mobil dikey için optimize
  camera.position.x = player.position.x * 0.5 + shakeX;
  camera.position.y = 4.5 + shakeY;
  camera.position.z = 9;
  camera.lookAt(player.position.x * 0.35, 1.5, -12);
  
  const moveAmount = state.speed * dt * 2;
  laneDashes.forEach(d => {
    d.position.z += moveAmount;
    if (d.position.z > 20) d.position.z -= 300;
  });
  
  for (let i = state.cars.length - 1; i >= 0; i--) {
    const car = state.cars[i];
    car.position.z += moveAmount;
    if (car.position.z > 15) {
      scene.remove(car);
      state.cars.splice(i, 1);
    }
  }
  
  state.lastSpawn += moveAmount;
  if (state.lastSpawn > 75) {
    spawnEnemyCar();
    state.lastSpawn = 0;
  }
  
  state.distance += state.speed * dt / 5;
  state.money += moneyPerMeter() * (state.speed * dt / 5);
  
  if (state.speed > 1.5) state.shake = Math.min(0.8, state.shake + 0.015 * dt);
  
  for (const car of state.cars) {
    if (checkCollision(player, car)) {
      endGame();
      return;
    }
  }
  
  document.getElementById('moneyHud').textContent = state.money.toFixed(4);
  document.getElementById('distance').textContent = Math.floor(state.distance);
  document.getElementById('speed').textContent = Math.floor(state.speed * 60);
  
  renderer.render(scene, camera);
}

function startAnimationLoop() {
  if (!animationRunning) {
    animationRunning = true;
    lastTime = performance.now();
    animate();
  }
}

// ==================== OYUN BİTİŞ ====================
let penaltyAmount = 0;

function endGame() {
  state.running = false;
  penaltyAmount = state.money / 2;
  document.getElementById('earned').textContent = state.money.toFixed(4);
  document.getElementById('penalty').textContent = penaltyAmount.toFixed(4);
  document.getElementById('gameOver').style.display = 'flex';
}

window.watchAd = function() {
  alert('📺 Reklam gösteriliyor... (Gerçek sistemde 30sn video)');
  addToWallet(state.money);
  state.running = true;
  document.getElementById('gameOver').style.display = 'none';
  player.position.x = 0;
  state.playerLane = 0;
  state.targetLane = 0;
  for (let i = state.cars.length - 1; i >= 0; i--) {
    if (state.cars[i].position.z > player.position.z - 20) {
      scene.remove(state.cars[i]);
      state.cars.splice(i, 1);
    }
  }
  startAnimationLoop();
};

window.restart = function() {
  const remaining = Math.max(0, state.money - penaltyAmount);
  addToWallet(remaining);
  resetGameState();
  document.getElementById('gameOver').style.display = 'none';
  state.running = true;
  startAnimationLoop();
};

window.goHome = function() {
  if (state.running || state.money > 0) {
    const remaining = Math.max(0, state.money - (state.running ? 0 : penaltyAmount));
    addToWallet(remaining);
  }
  state.running = false;
  animationRunning = false;
  document.getElementById('gameOver').style.display = 'none';
  document.getElementById('hud').style.display = 'none';
  renderer.domElement.style.display = 'none';
  document.getElementById('homeScreen').style.display = 'flex';
  document.getElementById('walletScreen').style.display = 'none';
  resetGameState();
};

window.startGame = function() {
  resetGameState();
  document.getElementById('homeScreen').style.display = 'none';
  document.getElementById('walletScreen').style.display = 'none';
  document.getElementById('hud').style.display = 'block';
  renderer.domElement.style.display = 'block';
  state.running = true;
  startAnimationLoop();
};

window.showWallet = function() {
  updateWalletUI();
  document.getElementById('homeScreen').style.display = 'none';
  document.getElementById('walletScreen').style.display = 'flex';
};

window.requestWithdraw = async function() {
  const method = document.getElementById('withdrawMethod').value;
  const account = document.getElementById('withdrawAccount').value.trim();
  const amount = parseFloat(document.getElementById('withdrawAmount').value);
  
  if (!account) { alert('⚠️ Lütfen IBAN veya Payeer hesabınızı girin.'); return; }
  if (isNaN(amount) || amount < 10) { alert('⚠️ Minimum çekim tutarı 10₺.'); return; }
  
  const w = getWallet();
  if (amount > w.balance) { alert('⚠️ Yetersiz bakiye. Bakiyeniz: ' + w.balance.toFixed(2) + '₺'); return; }
  
  w.balance -= amount;
  w.pending += amount;
  w.history.push({ method, account, amount, date: new Date().toISOString(), status: 'pending' });
  saveWallet(w);
  
  try {
    await fetch('/api/notify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ method, account, amount, username: 'user_' + Date.now() })
    });
  } catch (err) {
    console.error('E-posta hatası:', err);
  }
  
  alert('✅ Çekim talebiniz alındı!\n\nYöntem: ' + (method === 'iban' ? 'IBAN' : 'Payeer') + '\nHesap: ' + account + '\nTutar: ' + amount.toFixed(2) + '₺');
  
  updateWalletUI();
  document.getElementById('withdrawAccount').value = '';
  document.getElementById('withdrawAmount').value = '';
};

function updateWalletUI() {
  const w = getWallet();
  document.getElementById('walletBalance').textContent = w.balance.toFixed(2);
  document.getElementById('walletPending').textContent = w.pending.toFixed(2);
}

function resetGameState() {
  state.money = 0;
  state.distance = 0;
  state.speed = 0.4;
  state.playerLane = 0;
  state.targetLane = 0;
  state.shake = 0;
  state.lastSpawn = 0;
  if (player) {
    player.position.set(0, 0, 4);
    player.rotation.z = 0;
  }
  state.cars.forEach(c => scene.remove(c));
  state.cars = [];
  penaltyAmount = 0;
  camera.position.set(0, 4.5, 9);
  document.getElementById('moneyHud').textContent = '0.0000';
  document.getElementById('distance').textContent = '0';
  document.getElementById('speed').textContent = '0';
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Mobil tarayıcı adres çubuğu yüzünden ekran yüksekliği değişirse
window.addEventListener('orientationchange', () => {
  setTimeout(() => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }, 300);
});

updateWalletUI();
</script>
</body>
</html>
